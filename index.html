<script>
(function(){
"use strict";

// ===== 00_util.js =====
// ---------------------------------------------------------------------------
// COLD BORE - shared helpers
// ---------------------------------------------------------------------------
const CB = {};
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const sign = (v) => (v < 0 ? -1 : 1);
const approach = (v, target, rate) => (v < target ? Math.min(target, v + rate) : Math.max(target, v - rate));

// Small fast seeded random number generator so every mission plays the same
// way every time (important for fair retries and for automated testing).
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const f = () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    f,
    r: (lo, hi) => lo + (hi - lo) * f(),
    i: (lo, hi) => Math.floor(lo + (hi - lo + 1) * f()),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
    gauss: () => { // roughly normal, mean 0 sd 1
      let s = 0; for (let i = 0; i < 6; i++) s += f();
      return (s - 3) / 0.7071;
    },
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// Smooth 1D noise in -1..1, used for scope tremor and wind gusts.
function vnoise(t, seed) {
  const i = Math.floor(t), f = t - i;
  const h = (n) => {
    let x = Math.imul((n + seed * 7919) | 0, 374761393);
    x = (x ^ (x >>> 13)) | 0; x = Math.imul(x, 1274126177);
    return (((x ^ (x >>> 16)) >>> 0) / 2147483648) - 1;
  };
  const u = f * f * (3 - 2 * f);
  return lerp(h(i), h(i + 1), u);
}

// ---- colour helpers --------------------------------------------------------
const _rgbCache = new Map();
function rgbOf(hex) {
  let c = _rgbCache.get(hex);
  if (c) return c;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  _rgbCache.set(hex, c);
  return c;
}
const _mixCache = new Map();
function mix(a, b, t) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  const q = Math.round(t * 32);
  const key = a + b + q;
  let v = _mixCache.get(key);
  if (v) return v;
  const A = rgbOf(a), B = rgbOf(b), k = q / 32;
  const to = (x) => { const s = Math.round(x).toString(16); return s.length < 2 ? '0' + s : s; };
  v = '#' + to(lerp(A[0], B[0], k)) + to(lerp(A[1], B[1], k)) + to(lerp(A[2], B[2], k));
  if (_mixCache.size > 6000) _mixCache.clear();
  _mixCache.set(key, v);
  return v;
}
function rgba(hex, a) {
  const c = rgbOf(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
const lighten = (hex, t) => mix(hex, '#ffffff', t);
const darken = (hex, t) => mix(hex, '#000000', t);

function fmt(n, d) { return Number(n).toFixed(d === undefined ? 1 : d); }
function fmtTime(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

CB.util = { clamp, lerp, smooth, makeRng, hashStr, vnoise, mix, rgba };


// ===== 01_ballistics.js =====
// ---------------------------------------------------------------------------
// Ballistics. Real units: metres, seconds, metres per second.
// Angles are in "mils" (milliradians): 1 mil = 1 metre wide at 1000 metres,
// or 10 cm at 100 metres. Scope markings are drawn in the same unit, so the
// marks on the glass are true to the bullet's flight.
//
// Axes: x = left/right, y = up, z = away from the shooter.
// ---------------------------------------------------------------------------
const GRAV = 9.81;
const SOUND = 343;

const Bal = CB.Bal = {
  // Advance one bullet by dt seconds. k is the drag factor (bigger = loses
  // speed faster). Wind is the air's own velocity; the bullet is dragged
  // toward moving with the air, which is what causes wind drift.
  step(b, dt, k, wx, wz) {
    const rx = b.vx - wx, ry = b.vy, rz = b.vz - wz;
    const sp = Math.sqrt(rx * rx + ry * ry + rz * rz);
    const d = k * sp * dt;
    b.vx -= d * rx;
    b.vy -= d * ry + GRAV * dt;
    b.vz -= d * rz;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    b.t += dt;
  },

  launch(v0, axMil, ayMil) {
    const dx = axMil / 1000, dy = ayMil / 1000;
    const n = 1 / Math.sqrt(dx * dx + dy * dy + 1);
    return { x: 0, y: 0, z: 0, vx: v0 * dx * n, vy: v0 * dy * n, vz: v0 * n, t: 0 };
  },

  // Fly a test bullet from the origin until it has travelled `dist` metres
  // downrange. Returns where it is (x, y), the flight time and its speed.
  flyTo(st, axMil, ayMil, dist, wx, wz) {
    const b = Bal.launch(st.v0, axMil, ayMil);
    const k = st.k;
    let guard = 0, px = 0, py = 0, pz = 0, pt = 0;
    while (b.z < dist && guard++ < 6000) {
      px = b.x; py = b.y; pz = b.z; pt = b.t;
      const sp = Math.max(60, Math.abs(b.vz));
      Bal.step(b, Math.min(1 / 240, 4 / sp), k, wx || 0, wz || 0);
      if (b.vz < 20) break;
    }
    const f = b.z > pz ? clamp((dist - pz) / (b.z - pz), 0, 1) : 1;
    return {
      x: lerp(px, b.x, f), y: lerp(py, b.y, f), t: lerp(pt, b.t, f),
      v: Math.sqrt(b.vx * b.vx + b.vy * b.vy + b.vz * b.vz), reached: b.z >= dist,
    };
  },

  // How far the barrel must be tilted up (mils) so the bullet crosses the
  // line of sight at the zero range.
  zeroAngle(st, zeroRange) {
    let a = 0;
    for (let i = 0; i < 5; i++) {
      const r = Bal.flyTo(st, 0, a, zeroRange, 0, 0);
      a -= (r.y / zeroRange) * 1000;
    }
    return a;
  },

  // "Dope" is shooter slang for the correction a given shot needs.
  // dropMil > 0 means hold that many mils HIGH. driftMil > 0 means the
  // bullet lands to the right of the crosshair.
  dope(st, zeroAng, range, wx) {
    const r = Bal.flyTo(st, 0, zeroAng, range, wx || 0, 0);
    return { dropMil: -(r.y / range) * 1000, driftMil: (r.x / range) * 1000, tof: r.t, v: r.v, reached: r.reached };
  },

  // Find the aim (mils from straight ahead) that lands a bullet on the point
  // (dx, dy) at distance `dist`, allowing for drop and wind.
  solve(st, zeroAng, dx, dy, dist, wx, wz) {
    let ax = (dx / dist) * 1000, ay = (dy / dist) * 1000, tof = 0;
    for (let i = 0; i < 6; i++) {
      const r = Bal.flyTo(st, ax, ay + zeroAng, dist, wx || 0, wz || 0);
      ax -= ((r.x - dx) / dist) * 1000;
      ay -= ((r.y - dy) / dist) * 1000;
      tof = r.t;
    }
    return { ax, ay, tof };
  },
};


// ===== 02_arsenal.js =====

//
//   v0       muzzle speed in metres per second (faster = less lead, less drop)
//   k        drag (bigger = sheds speed sooner, drops more, drifts more in wind)
//   disp     how tight the rifle groups, in mils (smaller = more exact)
//   sway     how much the crosshair wanders, in mils
//   recoil   how far the scope jumps when fired, in mils
//   cycle    seconds before the next shot is ready
//   noise    distance in metres at which an unsuppressed shot causes panic
//   pen      punch: 1 goes clean through glass, 1.4 through thin cover,
//            3 through a wall
//   eff      the range the rifle is honestly good to
// ---------------------------------------------------------------------------
const GUNS = [

const GUN_BY_ID = {}; GUNS.forEach((g) => { GUN_BY_ID[g.id] = g; });
const SCOPE_BY_ID = {}; SCOPES.forEach((s) => { SCOPE_BY_ID[s.id] = s; });
const PART_BY_ID = {}; PARTS.forEach((p) => { PART_BY_ID[p.id] = p; });

function defaultConfig(gunId) {
  const g = GUN_BY_ID[gunId];
  return { scope: g.scope, muzzle: 'mz_none', barrel: 'br_std', stock: 'st_std', support: 'sp_none', ammo: 'am_ball', trigger: 'tr_std', action: 'ac_std', mag: 'mg_std', skin: 'factory' };
}

// Can this part go on this rifle?
function partFits(part, gun) {
  if (part.needsSupp && gun.supp !== true) return false;
  if (part.slot === 'muzzle' && gun.supp === 'integral' && part.id !== 'mz_none') return false;
  if (part.slot === 'muzzle' && gun.action === 'charge' && part.id !== 'mz_none') return false;
  if (part.slot === 'barrel' && (gun.supp === 'integral' || gun.action === 'charge') && part.id !== 'br_std') return false;
  if (part.needsMag && (gun.action === 'single' || gun.action === 'charge')) return false;
  if (part.slot === 'action' && part.id !== 'ac_std' && (gun.action === 'single' || gun.action === 'charge')) return false;
  if (part.cals && part.cals.indexOf(gun.cal) < 0) return false;
  if (part.slot === 'ammo' && gun.action === 'charge' && part.id !== 'am_ball') return false;
  if (part.id === 'am_sub' && gun.supp === 'integral') return false;
  return true;
}
function scopeFits(scope, gun) {
  if (gun.scopeLock) return scope.id === gun.scope;
  if (scope.only) return scope.only === gun.id;
  return true;
}

// Turn a rifle plus its fitted parts into the final numbers the game uses.
function buildStats(gunId, cfg) {
  const g = GUN_BY_ID[gunId];
  cfg = Object.assign(defaultConfig(gunId), cfg || {});
  const st = {
    id: g.id, name: g.name, gun: g, cfg, action: g.action, cal: g.cal,
    v0: g.v0, k: g.k, disp: g.disp, sway: g.sway, recoil: g.recoil, cycle: g.cycle, reload: g.reload,
    mag: g.mag, handling: g.handling, noise: g.noise, pen: g.pen, eff: g.eff, zero: g.zero,
    breath: 4.6, pan: 1, jerk: 0.16, quiet: g.supp === 'integral', crack: g.supp === 'integral' ? 16 : 0,
    tracer: false, sub: false,
  };
  ['muzzle', 'barrel', 'stock', 'support', 'ammo', 'trigger', 'action', 'mag'].forEach((slot) => {
    const p = PART_BY_ID[cfg[slot]];
    if (!p || !partFits(p, g)) return;
    const m = p.mod;
    if (m.swayMul) st.sway *= m.swayMul;
    if (m.recoilMul) st.recoil *= m.recoilMul;
    if (m.v0Mul) st.v0 *= m.v0Mul;
    if (m.kMul) st.k *= m.kMul;
    if (m.dispMul) st.disp *= m.dispMul;
    if (m.cycleMul) st.cycle *= m.cycleMul;
    if (m.reloadMul) st.reload *= m.reloadMul;
    if (m.noiseMul) st.noise *= m.noiseMul;
    if (m.handAdd) st.handling += m.handAdd;
    if (m.breathAdd) st.breath += m.breathAdd;
    if (m.magMul) st.mag = Math.max(st.mag + 1, Math.round(st.mag * m.magMul));
    if (m.panMul) st.pan *= m.panMul;
    if (m.penAdd) st.pen += m.penAdd;
    if (m.jerkMul) st.jerk *= m.jerkMul;
    if (m.quiet) { st.quiet = true; st.crack = m.crack; }
    if (m.tracer) st.tracer = true;
    if (m.sub) st.sub = true;
  });
  if (st.sub) {
    // Subsonic loads: slow, heavy, quiet. Also much less recoil.
    st.v0 = Math.min(st.v0, 318); st.k *= 0.55; st.recoil *= 0.5; st.eff = Math.min(st.eff, 280); st.noise *= 0.55;
  }
  st.handling = clamp(st.handling, 0.1, 1.2);
  st.subsonic = st.v0 < SOUND;
  st.silent = st.quiet && st.subsonic;
  if (st.quiet) st.noise = 0;
  if (st.silent) st.crack = 0;
  let sc = SCOPE_BY_ID[cfg.scope] || SCOPE_BY_ID[g.scope];
  if (!scopeFits(sc, g)) sc = SCOPE_BY_ID[g.scope];
  st.scope = sc;
  st.zoomMin = sc.zoom[0]; st.zoomMax = sc.zoom[1];
  st.zeroAng = Bal.zeroAngle(st, st.zero);
  return st;
}

// Simple 0..1 ratings for the stat bars in the armory.
function statBars(st) {
  const d500 = Bal.dope(st, st.zeroAng, 500, 4);
  return {
    reach: clamp(st.eff / 2000, 0.05, 1),
    flat: clamp(1 - (d500.reached ? d500.dropMil : 60) / 30, 0.03, 1),
    wind: clamp(1 - (d500.reached ? Math.abs(d500.driftMil) : 6) / 3.2, 0.03, 1),
    steady: clamp(1 - (st.sway - 0.2) / 1.1, 0.03, 1),
    exact: clamp(1 - st.disp / 0.34, 0.03, 1),
    calm: clamp(1 - st.recoil / 26, 0.03, 1),
    rate: clamp(1 - (st.cycle - 0.2) / 2.2, 0.03, 1),
    quiet: st.silent ? 1 : st.quiet ? 0.72 : clamp(0.45 - st.noise / 2900, 0.03, 0.45),
  };
}

CB.GUNS = GUNS; CB.SCOPES = SCOPES; CB.PARTS = PARTS; CB.buildStats = buildStats;

// ---------------------------------------------------------------------------
// Stick figures: poses, drawing, and the shapes bullets are tested against.
// Local space: feet at (0,0), y up, facing +x. Units are metres.
// ---------------------------------------------------------------------------
const FIG = { hip: 0.86, torso: 0.56, headUp: 0.2, headR: 0.17, thigh: 0.44, shin: 0.44, arm: 0.29, fore: 0.29, lw: 0.085 };

// Build joint positions from a handful of angles. Angles are measured from
// "hanging straight down"; positive swings forward.
function figJoints(p) {
  const hx = p.hx || 0, hy = p.hy === undefined ? FIG.hip : p.hy;
  const lean = p.lean || 0;
  const nx = hx + Math.sin(lean) * FIG.torso, ny = hy + Math.cos(lean) * FIG.torso;
  const ht = lean * 0.6 + (p.head || 0);
  const J = {
    hip: [hx, hy], neck: [nx, ny],
    head: [nx + Math.sin(ht) * FIG.headUp, ny + Math.cos(ht) * FIG.headUp],
  };
  const sx = hx + Math.sin(lean) * (FIG.torso - 0.05), sy = hy + Math.cos(lean) * (FIG.torso - 0.05);
  J.sh = [sx, sy];
  const limb = (ox, oy, a, l1, b, l2) => {
    const mx = ox + Math.sin(a) * l1, my = oy - Math.cos(a) * l1;
    return [[mx, my], [mx + Math.sin(b) * l2, my - Math.cos(b) * l2]];
  };
  let r = limb(hx, hy, p.tL || 0, FIG.thigh, (p.tL || 0) - (p.kL || 0), FIG.shin); J.knL = r[0]; J.ftL = r[1];
  r = limb(hx, hy, p.tR || 0, FIG.thigh, (p.tR || 0) - (p.kR || 0), FIG.shin); J.knR = r[0]; J.ftR = r[1];
  r = limb(sx, sy, p.aL || 0, FIG.arm, (p.aL || 0) + (p.eL || 0), FIG.fore); J.elL = r[0]; J.haL = r[1];
  r = limb(sx, sy, p.aR || 0, FIG.arm, (p.aR || 0) + (p.eR || 0), FIG.fore); J.elR = r[0]; J.haR = r[1];
  return J;
}

// Pose for a named animation at time t (seconds). `ph` is the walk phase.
function figPose(anim, t, ph, A) {
  const b = Math.sin(t * 1.6 + (A.seed || 0)) * 0.015;
  const p = { hy: FIG.hip + b * 0.4, lean: 0, tL: 0.04, tR: -0.04, kL: 0.02, kR: 0.02, aL: 0.06, aR: -0.06, eL: 0.12, eR: 0.12 };
  const s = Math.sin(ph), c = Math.cos(ph);
  switch (anim) {
    case 'walk':
      p.tL = 0.46 * s; p.tR = -0.46 * s;
      p.kL = 0.08 + 0.6 * Math.max(0, -c); p.kR = 0.08 + 0.6 * Math.max(0, c);
      p.aL = -0.38 * s; p.aR = 0.38 * s; p.eL = 0.28; p.eR = 0.28;
      p.hy = FIG.hip - 0.035 * Math.abs(s); p.lean = 0.05;
      break;
    case 'run': case 'panic':
      p.tL = 0.85 * s; p.tR = -0.85 * s;
      p.kL = 0.2 + 1.15 * Math.max(0, -c); p.kR = 0.2 + 1.15 * Math.max(0, c);
      p.hy = FIG.hip - 0.07 * Math.abs(s) - 0.03; p.lean = 0.24;
      if (anim === 'panic') { p.aL = 2.7 + 0.3 * s; p.aR = 2.5 - 0.3 * s; p.eL = 0.5; p.eR = 0.5; p.lean = 0.16; }
      else { p.aL = -0.9 * s; p.aR = 0.9 * s; p.eL = 1.4; p.eR = 1.4; }
      break;
    case 'phone':
      p.aR = 0.35; p.eR = 2.45; p.head = 0.06;
      p.aL = 0.05 + 0.04 * Math.sin(t * 0.7);
      break;
    case 'smoke': {
      const cyc = (t + (A.seed || 0) * 3) % 5.2;
      const up = cyc < 1.4 ? smooth(cyc / 0.35) * (1 - smooth((cyc - 1.05) / 0.35)) : 0;
      p.aR = lerp(0.1, 0.5, up); p.eR = lerp(0.35, 2.3, up);
      break;
    }
    case 'drink': {
      const cyc = (t + (A.seed || 0) * 3) % 6.5;
      const up = cyc < 1.6 ? smooth(cyc / 0.4) * (1 - smooth((cyc - 1.2) / 0.4)) : 0;
      p.aR = lerp(0.35, 0.55, up); p.eR = lerp(1.2, 2.25, up); p.head = -0.12 * up;
      break;
    }
    case 'talk':
      p.aR = 0.5 + 0.2 * Math.sin(t * 3.1 + (A.seed || 0)); p.eR = 1.3 + 0.45 * Math.sin(t * 2.3);
      p.aL = 0.15; p.eL = 0.5 + 0.2 * Math.sin(t * 1.7);
      p.head = 0.05 * Math.sin(t * 1.3);
      break;
    case 'sit': case 'type': case 'sitphone': case 'sitdrink':
      p.hy = 0.5; p.tL = 1.5; p.tR = 1.42; p.kL = 1.5; p.kR = 1.42; p.lean = 0.04;
      if (anim === 'type') { p.aL = 0.75; p.eL = 0.8 + 0.06 * Math.sin(t * 9); p.aR = 0.7; p.eR = 0.85 + 0.06 * Math.cos(t * 11); p.lean = 0.12; }
      else if (anim === 'sitphone') { p.aR = 0.35; p.eR = 2.45; p.aL = 0.5; p.eL = 0.9; }
      else if (anim === 'sitdrink') { const u = (Math.sin(t * 0.9 + (A.seed || 0)) > 0.75) ? 1 : 0; p.aR = 0.5; p.eR = u ? 2.2 : 1.2; p.aL = 0.5; p.eL = 0.9; }
      else { p.aL = 0.55; p.eL = 0.9; p.aR = 0.5; p.eR = 0.95; }
      break;
    case 'lean':
      p.lean = 0.3; p.aL = 0.75; p.eL = 0.55; p.aR = 0.85; p.eR = 0.5; p.tL = -0.12; p.tR = -0.2; p.hy = FIG.hip - 0.02;
      break;
    case 'guard':
      p.aL = 0.55; p.eL = 1.15; p.aR = 0.12; p.eR = 1.55; p.tL = 0.1; p.tR = -0.1;
      break;
    case 'aim':
      p.aL = 1.45; p.eL = 0.1; p.aR = 1.5; p.eR = 0.05; p.tL = 0.22; p.tR = -0.2; p.lean = 0.06;
      break;
    case 'aimrifle':
      p.aL = 1.25; p.eL = 0.4; p.aR = 0.7; p.eR = 1.5; p.tL = 0.25; p.tR = -0.22; p.lean = 0.1;
      break;
    case 'look':
      p.aL = 0.75; p.eL = 2.2; p.aR = 0.7; p.eR = 2.25; p.head = -0.05;
      break;
    case 'wave':
      p.aR = 2.6 + 0.25 * Math.sin(t * 7); p.eR = 0.4;
      break;
    case 'point':
      p.aR = 1.5; p.eR = 0.05; p.lean = 0.06;
      break;
    case 'kneel':
      p.hy = 0.47; p.tL = 0.4; p.kL = 1.95; p.tR = 0.3; p.kR = 1.9; p.aL = -0.5; p.eL = -0.7; p.aR = -0.55; p.eR = -0.7; p.lean = 0.08; p.head = 0.25;
      break;
    case 'cower':
      p.hy = 0.5; p.tL = 1.25; p.kL = 2.3; p.tR = 1.15; p.kR = 2.25; p.lean = 0.55; p.aL = 2.5; p.eL = 0.9; p.aR = 2.4; p.eR = 1.0;
      p.hx = 0.02 * Math.sin(t * 18);
      break;
    case 'work': // hands busy at waist height (welding, fishing, counting money)
      p.lean = 0.18; p.aL = 0.7; p.eL = 0.8 + 0.1 * Math.sin(t * 5); p.aR = 0.6; p.eR = 0.9 + 0.1 * Math.cos(t * 6);
      break;
    case 'sweep':
      p.lean = 0.22; p.aL = 0.6 + 0.2 * Math.sin(t * 2.4); p.eL = 0.5; p.aR = 0.3 + 0.2 * Math.sin(t * 2.4); p.eR = 0.9;
      break;
    case 'arms': // arms crossed, bored
      p.aL = 0.35; p.eL = 1.9; p.aR = 0.3; p.eR = 1.95;
      break;
    case 'hands': // hands up, surrendering
      p.aL = 2.75; p.eL = 0.25; p.aR = 2.6; p.eR = 0.3;
      break;
    case 'drive':
      p.hy = 0.5; p.tL = 1.5; p.tR = 1.45; p.kL = 1.3; p.kR = 1.3; p.aL = 1.0; p.eL = 0.5; p.aR = 1.05; p.eR = 0.45; p.lean = -0.08;
      break;
    case 'sleep':
      p.hy = 0.5; p.tL = 1.5; p.tR = 1.42; p.kL = 1.5; p.kR = 1.42; p.lean = -0.25; p.head = 0.5; p.aL = 0.2; p.aR = 0.15;
      break;
    default: // stand
      p.aL = 0.07 + b; p.aR = -0.05 - b;
  }
  return p;
}

// Rotate a set of joints about a pivot (used for falling over).
function figRotate(J, ang, px, py) {
  const cs = Math.cos(ang), sn = Math.sin(ang);
  for (const k in J) {
    const v = J[k], dx = v[0] - px, dy = v[1] - py;
    J[k] = [px + dx * cs - dy * sn, py + dx * sn + dy * cs];
  }
}

// Joints for an actor right now, in the actor's local space (already
// mirrored for facing and scaled for height).
function actorJoints(A) {
  let J;
  if (A.dead) {
    const base = figPose(A.deathPose || 'stand', A.deathAt || 0, A.deathPh || 0, A);
    const u = clamp((A.deadT || 0) / 0.75, 0, 1);
    const limp = smooth(clamp(u * 1.6, 0, 1));
    if (A.deathKind === 'slump') {
      // collapse where they sit: head forward, arms hang
      base.lean = lerp(base.lean, 0.9, limp); base.head = lerp(base.head || 0, 0.7, limp);
      base.aL = lerp(base.aL, 0.6, limp); base.aR = lerp(base.aR, 0.5, limp); base.eL = lerp(base.eL, 0.1, limp); base.eR = lerp(base.eR, 0.1, limp);
      J = figJoints(base);
    } else {
      base.aL = lerp(base.aL, 2.2, limp); base.aR = lerp(base.aR, 1.2, limp); base.eL = lerp(base.eL, 0.5, limp); base.eR = lerp(base.eR, 0.3, limp);
      base.tL = lerp(base.tL, 0.3, limp); base.tR = lerp(base.tR, -0.15, limp); base.kL = lerp(base.kL, 0.5, limp); base.kR = lerp(base.kR, 0.15, limp);
      base.head = lerp(base.head || 0, -0.35, limp);
      J = figJoints(base);
      // topple: accelerating fall with a small bounce at the end
      const dir = A.deathKind === 'front' ? -1 : 1;
      let ang = u < 0.82 ? Math.pow(u / 0.82, 2.2) : 1 - 0.06 * Math.sin(((u - 0.82) / 0.18) * Math.PI);
      figRotate(J, dir * ang * (Math.PI / 2 - 0.05), 0, 0);
      for (const k in J) J[k][1] = Math.max(J[k][1], 0.045);
    }
  } else {
    J = figJoints(figPose(A.anim || 'stand', A.t || 0, A.ph || 0, A));
  }
  const sc = (A.look && A.look.h) || 1, f = A.face || 1;
  for (const k in J) { J[k][0] *= f * sc; J[k][1] *= sc; }
  J.scale = sc;
  return J;
}

// Which part of the figure, if any, is at point (px, py) in local space.
function distSeg(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - a[0]) * dx + (py - a[1]) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (a[0] + dx * t), py - (a[1] + dy * t));
}
function figHit(J, px, py) {
  const sc = J.scale || 1;
  if (Math.hypot(px - J.head[0], py - J.head[1]) <= FIG.headR * sc + 0.012) return 'head';
  if (distSeg(px, py, J.hip, J.neck) <= 0.15 * sc) return 'torso';
  const limbR = 0.07 * sc;
  if (distSeg(px, py, J.hip, J.knL) <= limbR || distSeg(px, py, J.knL, J.ftL) <= limbR ||
      distSeg(px, py, J.hip, J.knR) <= limbR || distSeg(px, py, J.knR, J.ftR) <= limbR) return 'leg';
  if (distSeg(px, py, J.sh, J.elL) <= limbR || distSeg(px, py, J.elL, J.haL) <= limbR ||
      distSeg(px, py, J.sh, J.elR) <= limbR || distSeg(px, py, J.elR, J.haR) <= limbR) return 'arm';
  return null;
}

// ---- drawing ---------------------------------------------------------------
function seg(ctx, a, b) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }

// Draw an actor. ctx is already in the plane's metre space with y up.
// env: { ink, rim, px (metres per screen pixel), dark (0..1), nv }
function drawFigure(ctx, A, env) {
  const J = actorJoints(A);
  const L = A.look || {};
  const sc = J.scale, f = A.face || 1;
  const lw = FIG.lw * sc * (L.build === 'big' ? 1.3 : L.build === 'thin' ? 0.85 : 1);
  const minw = env.px * 1.1;
  const ink = env.ink, rim = env.rim;
  ctx.save();
  ctx.translate(A.x, A.y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const body = () => {
    ctx.beginPath();
    seg(ctx, J.sh, J.elL); seg(ctx, J.elL, J.haL);
    seg(ctx, J.hip, J.knL); seg(ctx, J.knL, J.ftL);
    seg(ctx, J.hip, J.neck);
    seg(ctx, J.hip, J.knR); seg(ctx, J.knR, J.ftR);
    seg(ctx, J.sh, J.elR); seg(ctx, J.elR, J.haR);
  };
  // pale outline first so the figure reads against any background
  if (rim) {
    ctx.strokeStyle = rim; ctx.fillStyle = rim;
    ctx.lineWidth = Math.max(lw + 0.045, minw + env.px * 1.6);
    body(); ctx.stroke();
    ctx.beginPath(); ctx.arc(J.head[0], J.head[1], FIG.headR * sc + Math.max(0.022, env.px * 0.8), 0, TAU); ctx.fill();
  }
  // carried on the back
  if (L.bag === 'backpack') {
    ctx.fillStyle = L.bagCol || '#5d6b4a';
    const bx = lerp(J.hip[0], J.neck[0], 0.62) - f * 0.17 * sc, by = lerp(J.hip[1], J.neck[1], 0.62);
    ctx.beginPath(); ctx.ellipse(bx, by, 0.13 * sc, 0.22 * sc, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = ink; ctx.fillStyle = ink;
  ctx.lineWidth = Math.max(lw, minw);
  body(); ctx.stroke();

  // clothing over the torso
  if (L.dress) {
    ctx.fillStyle = L.dress;
    ctx.beginPath();
    ctx.moveTo(J.neck[0] - 0.1 * sc, J.neck[1] - 0.08 * sc); ctx.lineTo(J.neck[0] + 0.1 * sc, J.neck[1] - 0.08 * sc);
    ctx.lineTo(J.hip[0] + 0.3 * sc, J.hip[1] - 0.38 * sc); ctx.lineTo(J.hip[0] - 0.3 * sc, J.hip[1] - 0.38 * sc);
    ctx.closePath(); ctx.fill();
  }
  if (L.coat) {
    ctx.strokeStyle = L.coat; ctx.lineWidth = Math.max(lw * 2.5, minw * 2); ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(lerp(J.hip[0], J.neck[0], 0.94), lerp(J.hip[1], J.neck[1], 0.94));
    const lowx = J.hip[0] - (J.neck[0] - J.hip[0]) * (L.long ? 0.55 : 0.05), lowy = J.hip[1] - (J.neck[1] - J.hip[1]) * (L.long ? 0.55 : 0.05);
    ctx.lineTo(lowx, lowy); ctx.stroke(); ctx.lineCap = 'round';
    // sleeves
    ctx.lineWidth = Math.max(lw * 1.35, minw * 1.3);
    ctx.beginPath(); seg(ctx, J.sh, J.elR); seg(ctx, J.elR, [lerp(J.elR[0], J.haR[0], 0.7), lerp(J.elR[1], J.haR[1], 0.7)]);
    seg(ctx, J.sh, J.elL); seg(ctx, J.elL, [lerp(J.elL[0], J.haL[0], 0.7), lerp(J.elL[1], J.haL[1], 0.7)]); ctx.stroke();
  }
  if (L.vest) {
    ctx.strokeStyle = L.vest; ctx.lineWidth = Math.max(lw * 2.4, minw * 2); ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(lerp(J.hip[0], J.neck[0], 0.92), lerp(J.hip[1], J.neck[1], 0.92));
    ctx.lineTo(lerp(J.hip[0], J.neck[0], 0.3), lerp(J.hip[1], J.neck[1], 0.3)); ctx.stroke();
    if (L.vestStripe) {
      ctx.strokeStyle = L.vestStripe; ctx.lineWidth = Math.max(lw * 0.5, minw * 0.6);
      ctx.beginPath(); ctx.moveTo(J.neck[0] - 0.1 * sc, lerp(J.hip[1], J.neck[1], 0.6)); ctx.lineTo(J.neck[0] + 0.1 * sc, lerp(J.hip[1], J.neck[1], 0.6)); ctx.stroke();
    }
    ctx.lineCap = 'round';
  }
  if (L.tie) {
    ctx.fillStyle = L.tie;
    const tx = J.neck[0] + f * 0.03 * sc, ty = J.neck[1] - 0.03 * sc;
    ctx.beginPath();
    ctx.moveTo(tx - 0.035 * sc, ty); ctx.lineTo(tx + 0.035 * sc, ty);
    ctx.lineTo(tx + f * 0.02 * sc + 0.05 * sc, ty - 0.27 * sc); ctx.lineTo(tx + f * 0.02 * sc, ty - 0.34 * sc); ctx.lineTo(tx + f * 0.02 * sc - 0.05 * sc, ty - 0.27 * sc);
    ctx.closePath(); ctx.fill();
  }
  if (L.scarf) {
    ctx.strokeStyle = L.scarf; ctx.lineWidth = Math.max(lw * 1.5, minw * 1.3);
    ctx.beginPath(); ctx.moveTo(J.neck[0] - 0.08 * sc, J.neck[1] + 0.02); ctx.lineTo(J.neck[0] + 0.08 * sc, J.neck[1] + 0.02);
    ctx.moveTo(J.neck[0] - f * 0.06 * sc, J.neck[1]); ctx.lineTo(J.neck[0] - f * 0.2 * sc, J.neck[1] - 0.3 * sc); ctx.stroke();
  }

  // head
  const hx = J.head[0], hy = J.head[1], hr = FIG.headR * sc;
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, TAU); ctx.fill();
  if (L.hair === 'long') {
    ctx.fillStyle = L.hairCol || '#6b4a2b';
    ctx.beginPath(); ctx.arc(hx - f * 0.03 * sc, hy + 0.01, hr * 1.12, f > 0 ? Math.PI * 0.35 : -Math.PI * 0.45, f > 0 ? Math.PI * 1.45 : Math.PI * 0.65); ctx.lineTo(hx - f * 0.16 * sc, hy - 0.32 * sc); ctx.closePath(); ctx.fill();
  } else if (L.hair === 'bun') {
    ctx.fillStyle = L.hairCol || '#3a2a20';
    ctx.beginPath(); ctx.arc(hx - f * 0.13 * sc, hy + 0.14 * sc, 0.08 * sc, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(hx, hy + 0.02, hr * 1.06, 0.15, Math.PI - 0.15); ctx.fill();
  } else if (L.hair === 'mohawk') {
    ctx.fillStyle = L.hairCol || '#e0413a';
    ctx.beginPath(); ctx.ellipse(hx, hy + hr * 0.95, hr * 0.85, hr * 0.42, 0, 0, TAU); ctx.fill();
  } else if (L.hair === 'short') {
    ctx.fillStyle = L.hairCol || '#7a5a3a';
    ctx.beginPath(); ctx.arc(hx, hy + 0.015, hr * 1.05, 0.25, Math.PI - 0.25); ctx.closePath(); ctx.fill();
  } else if (L.hair === 'white') {
    ctx.fillStyle = '#e8e8e2';
    ctx.beginPath(); ctx.arc(hx - f * 0.02, hy + 0.015, hr * 1.05, 0.1, Math.PI - 0.1); ctx.closePath(); ctx.fill();
  }
  if (L.beard) {
    ctx.fillStyle = L.beard === true ? '#8a8f96' : L.beard;
    ctx.beginPath(); ctx.arc(hx + f * 0.03 * sc, hy - 0.03 * sc, hr * 0.98, f > 0 ? -1.9 : -2.9, f > 0 ? -0.2 : -1.2); ctx.closePath(); ctx.fill();
  }
  if (L.glasses) {
    ctx.strokeStyle = L.glasses === 'shades' ? '#f2f4f7' : '#cfd6de'; ctx.lineWidth = Math.max(0.022 * sc, minw * 0.7);
    ctx.beginPath();
    if (L.glasses === 'shades') { ctx.moveTo(hx - f * 0.02 * sc, hy + 0.03 * sc); ctx.lineTo(hx + f * 0.17 * sc, hy + 0.03 * sc); ctx.lineWidth = Math.max(0.05 * sc, minw); }
    else { ctx.arc(hx + f * 0.1 * sc, hy + 0.02 * sc, 0.045 * sc, 0, TAU); ctx.moveTo(hx + f * 0.05 * sc, hy + 0.02 * sc); ctx.lineTo(hx - f * 0.12 * sc, hy + 0.04 * sc); }
    ctx.stroke();
  }
  if (L.mask) {
    ctx.fillStyle = L.mask; ctx.beginPath(); ctx.arc(hx, hy, hr * 1.02, Math.PI + 0.25, TAU - 0.25); ctx.closePath(); ctx.fill();
  }
  if (L.phones) {
    ctx.strokeStyle = L.phones; ctx.lineWidth = Math.max(0.04 * sc, minw);
    ctx.beginPath(); ctx.arc(hx, hy, hr * 1.12, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.fillStyle = L.phones; ctx.beginPath(); ctx.arc(hx - f * 0.02, hy, 0.07 * sc, 0, TAU); ctx.fill();
  }
  // hats
  const hat = L.hat, hc = L.hatCol || '#2a2d33';
  if (hat) {
    ctx.fillStyle = hc; ctx.strokeStyle = hc;
    const top = hy + hr * 0.62;
    if (hat === 'fedora') {
      ctx.lineWidth = Math.max(0.045 * sc, minw); ctx.beginPath(); ctx.moveTo(hx - 0.3 * sc, top); ctx.lineTo(hx + 0.3 * sc, top); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx - 0.17 * sc, top); ctx.lineTo(hx - 0.15 * sc, top + 0.17 * sc); ctx.quadraticCurveTo(hx, top + 0.21 * sc, hx + 0.15 * sc, top + 0.17 * sc); ctx.lineTo(hx + 0.17 * sc, top); ctx.closePath(); ctx.fill();
      if (L.hatBand) { ctx.fillStyle = L.hatBand; ctx.fillRect(hx - 0.168 * sc, top + 0.015 * sc, 0.336 * sc, 0.045 * sc); }
    } else if (hat === 'cap') {
      ctx.beginPath(); ctx.arc(hx, top - 0.03 * sc, hr * 1.04, 0, Math.PI); ctx.closePath(); ctx.fill();
      ctx.lineWidth = Math.max(0.045 * sc, minw); ctx.beginPath(); ctx.moveTo(hx, top - 0.02 * sc); ctx.lineTo(hx + f * 0.3 * sc, top - 0.04 * sc); ctx.stroke();
    } else if (hat === 'beanie') {
      ctx.beginPath(); ctx.arc(hx, hy + 0.03 * sc, hr * 1.08, 0.05, Math.PI - 0.05); ctx.closePath(); ctx.fill();

// ===== 04_scenekit.js =====
// ---------------------------------------------------------------------------
// Scene kit. A scene is a stack of flat "planes" at different distances from
// the shooter, drawn far to near. Because each plane sits at a real distance,
// they slide against each other as the scope pans, and they shrink or grow
// correctly when the shooter picks a different position.
//
// Each plane holds:
//   items     things to draw (walls, cars, trees)
//   solids    rectangles that stop bullets (with a material)
//   openings  windows and gaps that bullets and eyes can pass through
// All positions are in metres, y up, ground normally at y = 0.
// ---------------------------------------------------------------------------
const PALS = {
  day: { skyTop: '#3f8fd6', skyBot: '#cde6f5', fog: '#bcd6e6', fogD: 2600, amb: '#ffffff', ambT: 0, ink: '#13161b', rim: 'rgba(255,255,255,0.55)',
    glass: '#2b4257', lit: '#f6e2a0', litChance: 0.06, star: 0, cloud: '#ffffff', ground: '#a3a9ad', road: '#4c5259', grass: '#6c9d58', water: '#3d7ca6', sun: '#fff7d6', inRoom: '#34404e', dark: 0 },
  dawn: { skyTop: '#3b4f86', skyBot: '#f6c9a0', fog: '#d9bfae', fogD: 2000, amb: '#6a5a78', ambT: 0.22, ink: '#12141a', rim: 'rgba(255,240,225,0.5)',
    glass: '#2a3b52', lit: '#f8dc98', litChance: 0.3, star: 0.15, cloud: '#f8d6c0', ground: '#8f8f96', road: '#44474f', grass: '#5d8452', water: '#56789c', sun: '#ffe2b0', inRoom: '#2a3442', dark: 0.15 },
  dusk: { skyTop: '#22234f', skyBot: '#ef8a55', fog: '#b77b78', fogD: 2100, amb: '#33274d', ambT: 0.46, ink: '#0e1016', rim: 'rgba(255,225,205,0.45)',
    glass: '#1f2c44', lit: '#ffd98a', litChance: 0.5, star: 0.25, cloud: '#e9a07c', ground: '#6b6672', road: '#34343f', grass: '#3f5c44', water: '#4a5a80', sun: '#ffc27a', inRoom: '#1d2535', dark: 0.35 },
  night: { skyTop: '#03050b', skyBot: '#142040', fog: '#0f1830', fogD: 1900, amb: '#060a16', ambT: 0.76, ink: '#07090d', rim: 'rgba(170,190,225,0.42)',
    glass: '#0c1424', lit: '#ffd27a', litChance: 0.36, star: 1, cloud: '#1a2644', ground: '#2a3040', road: '#161a24', grass: '#16261f', water: '#0d1a30', sun: '#e8eefc', inRoom: '#0a0f1b', dark: 1 },
  overcast: { skyTop: '#6f7c88', skyBot: '#bcc4ca', fog: '#aeb7be', fogD: 1300, amb: '#56626c', ambT: 0.24, ink: '#13161b', rim: 'rgba(240,245,250,0.5)',
    glass: '#2b3a48', lit: '#f3dfa4', litChance: 0.22, star: 0, cloud: '#9aa5ae', ground: '#8b9196', road: '#454a50', grass: '#57795a', water: '#55707f', sun: '#d7dde2', inRoom: '#2a333d', dark: 0.12 },
  snow: { skyTop: '#8ea6be', skyBot: '#e6edf3', fog: '#dbe4ec', fogD: 1500, amb: '#c7d3df', ambT: 0.16, ink: '#12151a', rim: 'rgba(255,255,255,0.6)',
    glass: '#2b4257', lit: '#ffe0a0', litChance: 0.25, star: 0, cloud: '#ffffff', ground: '#eef2f6', road: '#b9c3cc', grass: '#e4eaef', water: '#7f9db4', sun: '#ffffff', inRoom: '#34404e', dark: 0.05 },
};

function makeScene(o) {
  o = o || {};
  const pal = Object.assign({}, PALS[o.time || 'day']);
  const S = {
    time: o.time || 'day', weather: o.weather || 'clear', pal, planes: [], objects: [], props: [], rooms: {}, zoneLamps: {},
    exits: o.exits || [-60, 60], rng: makeRng(o.seed || 7), refZ: o.refZ || 300, fogK: o.fog || 1, groundMat: o.groundMat || 'dirt',
    sky: { stars: [], clouds: [], sun: o.sun || [40, 60] }, darkZones: {}, litZones: {}, bounds: o.bounds || { x0: -45, x1: 45, y0: -2, y1: 32 }, decals: [], ambience: o.ambience || 'city',
  };
  S.haze = (z) => 1 - Math.exp((-z * S.fogK) / pal.fogD);
  S.plane = (z, name) => {
    const P = { z, name: name || 'p' + z, items: [], solids: [], openings: [], haze: S.haze(z), scene: S };
    P.add = (it) => { it.layer = it.layer || 0; P.items.push(it); return it; };
    P.solid = (x, y, w, h, mat, extra) => { const s = Object.assign({ x, y, w, h, mat: mat || 'wall' }, extra || {}); P.solids.push(s); return s; };
    P.open = (op) => { op.glass = op.glass !== false; op.broken = false; P.openings.push(op); return op; };
    S.planes.push(P);
    S.planes.sort((a, b) => b.z - a.z);
    return P;
  };
  // Colour as seen in this scene: darkened by time of day, faded by distance.
  S.tone = (hex, P, selfLit) => mix(mix(hex, pal.amb, selfLit ? pal.ambT * 0.25 : pal.ambT), pal.fog, P ? P.haze : 0);
  S.obj = (ob) => {
    ob.alive = ob.alive !== false; ob.id = ob.id || ('o' + S.objects.length);
    S.objects.push(ob);
    if (ob.kind === 'lamp' && ob.zone) (S.zoneLamps[ob.zone] = S.zoneLamps[ob.zone] || []).push(ob);
    return ob;
  };
  S.room = (id, lit) => { if (!S.rooms[id]) S.rooms[id] = { id, lit: !!lit }; else if (lit !== undefined) S.rooms[id].lit = !!lit; return S.rooms[id]; };
  // Is this spot lit well enough to see a body in? Rooms are lit or dark as a
  // whole; outdoors at night it depends on being near a working lamp.
  S.isLit = (zone, x) => {
    if (S.darkZones[zone]) return false;
    if (S.rooms[zone]) return S.rooms[zone].lit || pal.dark < 0.5;
    if (pal.dark < 0.5) return true;
    const l = S.zoneLamps[zone];
    if (!l) return !!S.litZones[zone];
    for (let i = 0; i < l.length; i++) if (l[i].alive && l[i].on !== false && (x === undefined || Math.abs(l[i].x - x) <= (l[i].reach || 9))) return true;
    return false;
  };
  // sky dressing
  const R = S.rng;
  if (pal.star > 0) for (let i = 0; i < 150; i++) S.sky.stars.push([R.r(-260, 260), R.r(-20, 240), R.r(0.4, 1.4), R.f()]);
  const nCloud = S.weather === 'clear' ? 5 : 9;
  for (let i = 0; i < nCloud; i++) S.sky.clouds.push({ x: R.r(-240, 240), y: R.r(25, 130), w: R.r(40, 110), h: R.r(8, 20), n: R.i(3, 6), s: R.f() });
  return S;
}

// ---- small drawing helpers --------------------------------------------------
function R4(ctx, x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
function poly(ctx, pts, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function line(ctx, x1, y1, x2, y2, col, w, env) {
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(w, env ? env.px * 0.9 : 0);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circ(ctx, x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }

const K = {};

// ---- ground and backdrops --------------------------------------------------
K.ground = function (S, P, o) {
  o = o || {};
  const y = o.y || 0, col = S.tone(o.col || S.pal.ground, P), x0 = o.x0 === undefined ? -4000 : o.x0, x1 = o.x1 === undefined ? 4000 : o.x1;
  const edge = o.edge ? S.tone(o.edge, P) : mix(col, '#ffffff', 0.12);
  P.groundY = y; P.groundMat = o.mat || S.groundMat;
  P.add({ x0, x1, layer: o.layer || 0, draw(ctx, env) {
    R4(ctx, x0, y - 400, x1 - x0, 400, col);
    if (!o.noEdge) R4(ctx, x0, y - Math.max(0.12, env.px * 1.2), x1 - x0, Math.max(0.12, env.px * 1.2), edge);
    if (o.stripes) { // road markings
      ctx.fillStyle = S.tone('#d9d2b0', P);
      const a = Math.floor(env.x0 / 6) * 6;
      for (let x = a; x < env.x1; x += 6) ctx.fillRect(x, y - o.stripes - 0.08, 2.4, 0.16);
    }
  } });
};

K.water = function (S, P, o) {
  o = o || {};
  const y = o.y || 0, col = S.tone(o.col || S.pal.water, P), hi = mix(col, '#ffffff', 0.22);
  P.groundY = y; P.groundMat = 'water';
  P.add({ x0: -4000, x1: 4000, layer: o.layer || 0, draw(ctx, env) {
    R4(ctx, -4000, y - 400, 8000, 400, col);
    ctx.strokeStyle = hi; ctx.lineWidth = Math.max(0.06, env.px);
    const step = Math.max(3, env.px * 26);
    ctx.beginPath();
    for (let row = 0; row < 5; row++) {
      const yy = y - 0.3 - row * row * 0.9 - row * 0.6;
      const a = Math.floor(env.x0 / step) * step;
      for (let x = a; x < env.x1; x += step) {
        const ph = Math.sin(x * 12.9898 + row * 78.233) * 43758.5453; const r = ph - Math.floor(ph);
        if (r > 0.55) continue;
        const dx = Math.sin(env.t * 0.7 + x + row) * 0.5;
        ctx.moveTo(x + dx + r * step, yy); ctx.lineTo(x + dx + r * step + 1.2 + r * 2, yy);
      }
    }
    ctx.stroke();
  } });
};

K.skyline = function (S, z, o) {
  const P = S.plane(z, 'skyline'); o = o || {};
  const R = makeRng(o.seed || 11), x0 = o.x0 === undefined ? -900 : o.x0, x1 = o.x1 === undefined ? 900 : o.x1, base = o.base || 0;
  const bl = [];
  let x = x0;
  while (x < x1) {
    const w = R.r(18, 60) * (o.scale || 1), h = R.r(o.hMin || 30, o.hMax || 160) * (R.chance(0.15) ? 1.5 : 1);
    const b = { x, w, h, c: S.tone(R.pick(o.cols || ['#5c6a7c', '#667488', '#4f5d70', '#727f90']), P), win: [], top: R.i(0, 3) };
    if (S.pal.litChance > 0.1) {
      const cols = Math.floor(w / 7), rows = Math.floor(h / 8);
      for (let i = 0; i < cols; i++) for (let j = 1; j < rows; j++) if (R.chance(S.pal.litChance * 0.55)) b.win.push([x + 3 + i * 7, base + j * 8]);
    }
    bl.push(b); x += w + R.r(-4, 14);
  }
  const lit = S.tone(S.pal.lit, P, true);
  P.add({ x0, x1, draw(ctx, env) {
    for (let i = 0; i < bl.length; i++) {
      const b = bl[i]; if (b.x + b.w < env.x0 || b.x > env.x1) continue;
      R4(ctx, b.x, base, b.w, b.h, b.c);
      if (b.top === 1) R4(ctx, b.x + b.w * 0.3, base + b.h, b.w * 0.4, b.h * 0.08, b.c);
      if (b.top === 2) { ctx.strokeStyle = b.c; ctx.lineWidth = Math.max(0.8, env.px); ctx.beginPath(); ctx.moveTo(b.x + b.w * 0.5, base + b.h); ctx.lineTo(b.x + b.w * 0.5, base + b.h * 1.18); ctx.stroke(); }
      if (env.s > 0.08) { ctx.fillStyle = lit; for (let j = 0; j < b.win.length; j++) ctx.fillRect(b.win[j][0], b.win[j][1], 3.2, 3.4); }
    }
  } });
  if (o.ground !== false) K.ground(S, P, { y: base, col: o.groundCol || '#6d7986', noEdge: true });
  return P;
};

K.mountains = function (S, z, o) {
  const P = S.plane(z, 'mtn'); o = o || {};
  const R = makeRng(o.seed || 5), x0 = o.x0 === undefined ? -3000 : o.x0, x1 = o.x1 === undefined ? 3000 : o.x1, base = o.base || 0, H = o.h || 600;
  const pts = []; let x = x0;
  while (x <= x1) { pts.push([x, base + H * (0.35 + 0.65 * Math.abs(vnoise(x / (o.rough || 420), o.seed || 5))) * (0.75 + 0.25 * R.f())]); x += R.r(60, 170) * (o.step || 1); }
  const rock = S.tone(o.col || '#5f6b78', P), shade = S.tone(darken(o.col || '#5f6b78', 0.22), P), snow = S.tone(o.snowCol || '#f2f6fa', P);
  P.add({ x0, x1, draw(ctx) {
    ctx.fillStyle = rock; ctx.beginPath(); ctx.moveTo(x0, base - 50);
    for (let i = 0; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineTo(x1, base - 50); ctx.closePath(); ctx.fill();

    else if (a.role === 'civ' && R.civFail) sim.fail('civ', a.failText || 'You shot a bystander. The contract is void.');
    else if (R.spare && R.spare.indexOf(a.id) >= 0) sim.fail('spare', a.failText || 'That one was not to be touched.');
    else if (a.role === 'guard' && R.noGuards) sim.fail('guard', R.noGuardsText || 'The guards were off limits.');
    else if (R.accidentOnly && R.kill.indexOf(a.id) >= 0 && !a.accident) sim.fail('messy', R.accidentText || 'It had to look like an accident. A bullet hole does not.');
  } else if (R.protect.indexOf(a.id) >= 0 || a.role === 'hostage' || a.role === 'vip') {

  sim.actors.forEach((o) => {

    if (o.state !== 'calm' && o.state !== 'susp') return;

  });
};
Sim.prototype.woundActor = function (a, part, bullet) {

// ---- vehicles ----------------------------------------------------------------
Sim.prototype.stepVehicle = function (v, dt) {
  const sim = this;
  if (v.gone) return;
  if (v.goal !== null) {
    const dx = v.goal - v.x; v.dir = sign(dx) || v.dir;
    const want = v.flatTire ? 0 : v.maxV;
    v.v = approach(v.v, want, dt * (v.flatTire ? 9 : 5));
    v.st.moving = v.v > 0.3;
    const stepd = v.v * dt;
    if (v.flatTire && v.v <= 0.01) { v.goal = null; v.stopped = true; sim.emit('stopped:' + v.id); return; }
    if (Math.abs(dx) <= stepd + 0.01) { v.x = v.goal; v.goal = null; v.v = v.keepV ? v.v : 0; v.st.moving = false; }
    else v.x += sign(dx) * stepd;
    return;
  }
  if (v.wait > 0) { v.wait -= dt; if (v.wait > 0) return; }
  if (v.waitFor) { if (sim.did(v.waitFor)) v.waitFor = null; else return; }
  let guard = 0;
  while (guard++ < 8) {
    const op = v.routine[v.pc]; if (!op) return; v.pc++;
    if (op[0] === 'drive') { v.goal = op[1]; v.maxV = op[2] || 8; const nx = v.routine[v.pc]; v.keepV = nx && (nx[0] === 'drive' || nx[0] === 'gone'); return; }
    if (op[0] === 'wait') { v.wait = op[1]; v.v = 0; return; }
    if (op[0] === 'waitFor') { v.waitFor = op[1]; if (!sim.did(op[1])) return; v.waitFor = null; }
    else if (op[0] === 'emit') sim.emit(op[1]);
    else if (op[0] === 'gone') { v.gone = true; sim.emit('gone:' + v.id); v.seats.forEach((id) => { const a = sim.byId[id]; if (a && !a.dead && a.inVeh === v) sim.leave(a); }); return; }
    else if (op[0] === 'brake') { v.goal = v.x + v.dir * Math.max(2, v.v * 0.9); v.maxV = 0; v.flatTire = true; return; }
    else if (op[0] === 'out') { const a = sim.byId[op[1]]; if (a && !a.dead) { a.inVeh = null; a.hidden = false; a.anim = a.idle = 'stand'; sim.place(a, Object.assign({ x: v.x + (op[2] || 0), y: v.y, plane: v.plane, zone: op[3] || 'street' })); v.seats[a.seat] = null; } }
    else if (op[0] === 'call') op[1](sim, v);
    else if (op[0] === 'loop') v.pc = op[1] || 0;
  }
};

// ---- bullets -----------------------------------------------------------------
Sim.prototype.groundAt = function (x, z) {

};
Sim.prototype.impact = function (b, x, y, P, mat, o) {
  const sim = this;

};
Sim.prototype.crack = function (b, x, y, P, skip) {
  const st = this.st;
  const v = Math.hypot(b.vx, b.vy, b.vz);

};
Sim.prototype.stopBullet = function (b) { b.alive = false; b.endT = this.t; };

Sim.prototype.hitPlane = function (P, b, bx, by) {
  const sim = this, S = sim.S, st = sim.st;
  // 1. shootable objects

    const ob = S.objects[i];
    if (ob.plane !== P || ob.r <= 0 || ob.gone) continue;
    if (!ob.alive && !ob.rehit) continue;
    const hit = ob.w ? (bx >= ob.x - ob.w / 2 && bx <= ob.x + ob.w / 2 && by >= ob.y - ob.h / 2 && by <= ob.y + ob.h / 2) : Math.hypot(bx - ob.x, by - ob.y) <= ob.r;
    if (!hit) continue;

  }
  // 2. people standing in the open
  for (let i = 0; i < sim.actors.length; i++) {
    const a = sim.actors[i];

    if (Math.abs(bx - a.x) > 1.3 || by < a.y - 0.2 || by > a.y + 2.4) continue;

    // tyres

    for (let s = 0; s < v.seats.length; s++) {
      const a = sim.byId[v.seats[s]]; if (!a || a.dead || a.inVeh !== v) continue;

  }

      sim.noise(bx, by, P, 'glass', 9);
      sim.emit('glass:' + op.room);
      if (st.pen < 0.2) { sim.crack(b, bx, by, P); sim.stopBullet(b); return true; }
      if (st.pen < 1) { const an = sim.shotRng.f() * TAU, m = (1 - st.pen) * 0.16; ox = Math.cos(an) * m; oy = Math.sin(an) * m; }
    }
    for (let j = 0; j < sim.actors.length; j++) {
      const a = sim.actors[j];
      if (a.plane !== P || a.dead || a.gone || a.hidden || !a.behind || a.room !== op.room || a.inVeh) continue;
      if (Math.abs(bx - a.x) > 1.3) continue;
      const part = figHit(actorJoints(a), bx + ox - a.x, by + oy - a.y);
      if (part && sim.hitActor(a, part, b, bx, by)) return true;
    }
    if (op.through) return false;

    const s = P.solids[i];
    if (bx < s.x || bx > s.x + s.w || by < s.y || by > s.y + s.h) continue;
    const m = s.mat;
    if (m === 'leaf' || m === 'grid') continue;

    if ((m === 'thin' || m === 'wood') && st.pen >= 1.4) { sim.impact(b, bx, by, P, m, { small: true }); continue; }
    if (m === 'wall' && st.pen >= 3 && b.walls < 1) { b.walls++; sim.impact(b, bx, by, P, 'wall', { small: true }); continue; }

};
Sim.prototype.scareVehicle = function (v) {

    if (!any) return;

    if (drv && !drv.dead && !v.flatTire) { v.routine = [['drive', v.dir > 0 ? 500 : -500, 18], ['gone']]; v.pc = 0; v.goal = null; v.wait = 0; v.waitFor = null; }

Sim.prototype.hitActor = function (a, part, b, bx, by) {

Sim.prototype.hitObject = function (ob, b, bx, by) {

    if (ob.killsCams) S.objects.forEach((c) => { if (c.kind === 'cctv') c.alive = false; });

Sim.prototype.explode = function (ob) {

Sim.prototype.stepBullet = function (b, dt) {
  const sim = this, S = sim.S, st = sim.st, planes = S.planes;
  let left = dt;

    left -= h;

    for (let i = planes.length - 1; i >= 0 && b.alive; i--) {

      if (sim.hitPlane(P, b, bx, by)) { b.x = bx; b.y = by; b.z = P.z; }

Sim.prototype.stepProps = function (dt) {

// The correction for a shot at the thing under the crosshair, given the

Sim.prototype.holdFor = function (d, dy) {

  this.W = 0; this.H = 0; this.dpr = 1; this.cx = 0; this.cy = 0; this.R = 100;

    marks.forEach((m) => { const y = m.mil * ppm; if (y > R * 0.93) return; chev(y, Math.max(3.5, ppm * 0.45), 1.2); if (ppm > 7) ctx.fillText(m.label, cx + Math.max(8, ppm * 1.1), cy + y + 3); });
    for (let i = 1; i <= 10; i++) { const x = i * ppm; if (x > R * 0.9) break; const h = i % 5 === 0 ? 6 : 3.5; L(x, -h, x, h, 1.1); L(-x, -h, -x, h, 1.1); }
    // stadiametric ladder: stand a 1.8 m figure on the base line
    const bx = -10 * ppm, byy = 9 * ppm;
    if (Math.hypot(bx * 0.6, byy) < R * 0.95) {
      L(-10.4 * ppm, byy, -1.6 * ppm, byy, 1.1);
      ctx.lineWidth = 1.1; ctx.beginPath();
      for (let r = 200; r <= 1000; r += 25) { const x = cx + (-10 + (r - 200) / 100) * ppm, y = cy + byy - (1800 / r) * ppm; if (r === 200) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.stroke();
      if (ppm > 6) { ctx.textAlign = 'center'; ctx.textBaseline = 'top'; for (let r = 200; r <= 1000; r += 200) ctx.fillText(String(r / 100), cx + (-10 + (r - 200) / 100) * ppm, cy + byy + 3); }
    }
  } else {
    // mil-based reticles: marks are true at every zoom level
    const maxMil = R / ppm;
    L(-R, 0, -4, 0, thin); L(4, 0, R, 0, thin); L(0, 4, 0, R, thin); L(0, -R, 0, -4, thin);
    ctx.beginPath(); ctx.arc(cx, cy, 1.1, 0, TAU); ctx.fill();
    if (type === 'mildot') {
      const dr = clamp(ppm * 0.11, 1.4, 4);
      for (let i = 1; i <= 12; i++) { const d = i * ppm; if (d > R * 0.95) break;
        if (i <= 5) { ctx.beginPath(); ctx.arc(cx + d, cy, dr, 0, TAU); ctx.arc(cx - d, cy, dr, 0, TAU); ctx.arc(cx, cy - d, dr, 0, TAU); ctx.fill(); }
        ctx.beginPath(); ctx.arc(cx, cy + d, dr, 0, TAU); ctx.fill();
        if (ppm > 11) { L(-3, d - ppm / 2, 3, d - ppm / 2, 1); }
        if (i % 5 === 0 && ppm > 6) { font(clamp(ppm * 0.8, 8, 12)); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(String(i), cx + 8, cy + d); }
      }
      const post = Math.max(6, Math.min(maxMil, 6)) * ppm;
      if (post < R) { L(-R, 0, -post, 0, 3.5); L(post, 0, R, 0, 3.5); L(0, -R, 0, -post, 3.5); }
    } else if (type === 'bdc') {
      const marks = V.bdcMarks(sim); font(clamp(ppm * 0.9, 9, 13)); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      marks.forEach((m) => { const y = m.mil * ppm; if (y > R * 0.93) return; const w = clamp(ppm * 1.2, 7, 22) * (m.r % 200 === 0 || m.r < 200 ? 1 : 0.65); L(-w, y, w, y, 1.4); ctx.beginPath(); ctx.arc(cx, cy + y, 1.6, 0, TAU); ctx.fill(); if (ppm > 5) ctx.fillText(m.label, cx + w + 5, cy + y + 0.5); });
      for (let i = 1; i <= 8; i++) { const x = i * ppm; if (x > R * 0.9) break; L(x, -3.5, x, 3.5, 1); L(-x, -3.5, -x, 3.5, 1); }
      L(-R, 0, -R * 0.55, 0, 3.5); L(R * 0.55, 0, R, 0, 3.5); L(0, -R, 0, -R * 0.55, 3.5);
    } else {
      // milhash / tree / fine
      const step = type === 'fine' && ppm > 28 ? 0.2 : ppm > 9 ? 0.5 : 1;
      const numEvery = ppm > 24 ? 1 : 2;
      font(clamp(ppm * 0.55, 8, 12));
      const lim = Math.min(maxMil * 0.95, 24);
      for (let m = step; m <= lim + 1e-6; m += step) {
        const d = m * ppm, whole = Math.abs(m - Math.round(m)) < 1e-6, half = Math.abs(m * 2 - Math.round(m * 2)) < 1e-6;
        const h = whole ? clamp(ppm * 0.3, 3, 9) : half ? clamp(ppm * 0.17, 2, 5) : clamp(ppm * 0.09, 1.5, 3);
        L(-h, d, h, d, thin);
        if (m <= Math.min(lim, 12)) { L(d, -h, d, h, thin); L(-d, -h, -d, h, thin); }
        if (m <= Math.min(lim, 6)) L(-h, -d, h, -d, thin);
        if (whole && Math.round(m) % numEvery === 0 && ppm > 5.5) { ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(String(Math.round(m)), cx - h - 4, cy + d + 0.5); if (m <= 12 && Math.round(m) % 2 === 0) { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(String(Math.round(m)), cx + d, cy - h - 2); ctx.fillText(String(Math.round(m)), cx - d, cy - h - 2); } }
      }
      if (type === 'tree') {
        const dr = clamp(ppm * 0.07, 1.1, 2.4);
        for (let r = 1; r <= lim; r++) { const wmax = Math.min(1 + Math.floor(r * 0.6), 8); for (let c = 1; c <= wmax; c++) { ctx.beginPath(); ctx.arc(cx + c * ppm, cy + r * ppm, dr, 0, TAU); ctx.arc(cx - c * ppm, cy + r * ppm, dr, 0, TAU); ctx.fill(); if (ppm > 16 && c <= wmax) { ctx.beginPath(); ctx.arc(cx + (c - 0.5) * ppm, cy + r * ppm, dr * 0.7, 0, TAU); ctx.arc(cx - (c - 0.5) * ppm, cy + r * ppm, dr * 0.7, 0, TAU); ctx.fill(); } } }
      }
    }
  }
  // electronic overlays
  const info = V.rangeInfo;
  if ((st.scope.lrf || st.scope.smart) && info) {
    ctx.fillStyle = nvc ? 'rgba(220,255,225,0.95)' : 'rgba(255,170,60,0.95)';
    ctx.font = '700 ' + clamp(R * 0.075, 11, 17) + 'px ui-monospace,"SF Mono",Menlo,Consolas,monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(info.d ? Math.round(info.d) + ' m' : '- - -', cx, cy - R * 0.72);
  }
  const showPip = (st.scope.smart || V.assist === 'full') && V.hold && V.hold.ok;
  if (showPip) {
    const px = cx - V.hold.right * ppm, py = cy + V.hold.up * ppm;
    if (Math.hypot(px - cx, py - cy) < R * 0.94) {
      ctx.strokeStyle = 'rgba(255,170,60,0.95)'; ctx.lineWidth = 1.6; const r = 6;
      ctx.beginPath(); ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,170,60,0.95)'; ctx.beginPath(); ctx.arc(px, py, 1.3, 0, TAU); ctx.fill();
    }
  }
  // hit confirmation tick marks
  if (V.hitMark > 0.05) {
    ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(1, V.hitMark * 1.4) + ')'; ctx.lineWidth = 2; const a = 9 + (1 - V.hitMark) * 8, b2 = a + 8;
    ctx.beginPath(); [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach((q) => { ctx.moveTo(cx + q[0] * a, cy + q[1] * a); ctx.lineTo(cx + q[0] * b2, cy + q[1] * b2); }); ctx.stroke();
  }
};

// Refresh the spotter's numbers a few times a second (range and hold).
View.prototype.updateReadout = function (sim, dt) {
  this.holdT -= dt;
  if (this.holdT > 0) return;
  this.holdT = 0.14;
  const aim = sim.aimNow();
  const r = sim.rangeAt(sim.sh.ax, sim.sh.ay);
  this.rangeInfo = r ? { d: r.d, ground: r.ground } : { d: 0 };
  this.hold = r && r.d > 20 ? sim.holdFor(r.d) : null;
};

CB.View = View;

  o = o || {}; const pole = S.tone('#c9ced3', P), c = S.tone(col || '#c0392b', P), c2 = S.tone(o.col2 || '#f1ede2', P);
  P.add({ x0: x - 5, x1: x + 5, layer: o.layer === undefined ? 2 : o.layer, draw(ctx, env) {

    const w = env.wind, a = Math.min(1, Math.abs(w) / 6), dir = w >= 0 ? 1 : -1, len = 2.6, top = y + h - 0.1;
    ctx.beginPath(); ctx.moveTo(x, top);
    const n = 8;
    for (let i = 1; i <= n; i++) { const u = i / n; const droop = (1 - a) * u * u * 1.5; const fl = Math.sin(env.t * (4 + a * 9) - u * 5) * 0.14 * (0.3 + a) * u; ctx.lineTo(x + dir * u * len * (0.25 + 0.75 * a), top - droop + fl); }
    for (let i = n; i >= 0; i--) { const u = i / n; const droop = (1 - a) * u * u * 1.5; const fl = Math.sin(env.t * (4 + a * 9) - u * 5) * 0.14 * (0.3 + a) * u; ctx.lineTo(x + dir * u * len * (0.25 + 0.75 * a), top - 1.3 - droop * 0.75 + fl); }
    ctx.closePath(); ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = c2; ctx.lineWidth = Math.max(0.16, env.px);
    ctx.beginPath(); for (let i = 0; i <= n; i++) { const u = i / n; const droop = (1 - a) * u * u * 1.5; const fl = Math.sin(env.t * (4 + a * 9) - u * 5) * 0.14 * (0.3 + a) * u; const px = x + dir * u * len * (0.25 + 0.75 * a), py = top - 0.65 - droop * 0.87 + fl; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } ctx.stroke();
  } });

K.chimney = function (S, P, x, y, o) {

// ---------------------------------------------------------------------------
// Progress, saved on this device automatically. If the browser refuses
// storage (private tabs sometimes do) the game still runs; it just forgets
// when the tab closes.
// ---------------------------------------------------------------------------
const SAVE_KEY = 'coldbore.save.v1';
const Save = CB.Save = { data: null, ok: true };

Save.fresh = function () {
  return {
    v: 1, credits: 0, xp: 0, equipped: 'fenwick',
    guns: { fenwick: { cfg: defaultConfig('fenwick') } },
    parts: {}, scopes: { hunter: 1 }, skins: { factory: 1 }, skinSeen: {}, caches: [], scrap: 0,
    missions: {}, flags: {}, seen: {}, ducks: {},
    settings: { sens: 0.6, assist: 'notes', slowmo: true, music: 0.55, sfx: 0.9, invert: false, lowRes: false },
    stats: { shots: 0, kills: 0, heads: 0, longest: 0, plays: 0, wins: 0, cachesOpened: 0 },
    created: Date.now(),
  };
};
Save.load = function () {
  let d = null;
  try { const raw = window.localStorage.getItem(SAVE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { Save.ok = false; }
  const f = Save.fresh();
  if (d && d.v === 1) {
    for (const k in f) if (d[k] === undefined) d[k] = f[k];
    for (const k in f.settings) if (d.settings[k] === undefined) d.settings[k] = f.settings[k];
    for (const k in f.stats) if (d.stats[k] === undefined) d.stats[k] = f.stats[k];
    Save.data = d;
  } else Save.data = f;
  return Save.data;
};
Save.write = function () {
  try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(Save.data)); Save.ok = true; } catch (e) { Save.ok = false; }
};
Save.reset = function () { Save.data = Save.fresh(); Save.write(); };
Save.exportText = function () { try { return btoa(unescape(encodeURIComponent(JSON.stringify(Save.data)))); } catch (e) { return ''; } };
Save.importText = function (txt) {
  try { const d = JSON.parse(decodeURIComponent(escape(atob(txt.trim())))); if (d && d.v === 1 && d.guns) { Save.data = d; Save.load.call(null); Save.data = d; const f = Save.fresh(); for (const k in f) if (d[k] === undefined) d[k] = f[k]; Save.write(); return true; } } catch (e) { /* bad text */ }
  return false;
};

// ---- the loop ------------------------------------------------------------------------
Game.loop = function (ts) {
  const G = Game;
  requestAnimationFrame(G.loop);
  let dt = Math.min(0.05, (ts - G.last) / 1000 || 0.016); G.last = ts;
  if (G.state !== 'mission' || !G.sim) { UI.tick && UI.tick(dt); return; }
  const sim = G.sim;
  if (G.paused) { return; }
  // slow motion while a long shot is in the air
  let want = 1;
  if (Save.data.settings.slowmo) {
    const flying = sim.bullets.find((b) => b.alive);
    if (flying && (sim.S.refZ - sim.eye0.z) / sim.st.v0 > 0.42 && sim.t - flying.t0 > 0.12) want = 0.34;
    if (sim.t < G.slowUntil) want = Math.min(want, 0.3);
    if (sim.winAt && sim.t < sim.winAt - 1.6) want = Math.min(want, 0.45);
  }
  G.scale += (want - G.scale) * Math.min(1, dt * (want < G.scale ? 14 : 5));
  const sdt = dt * G.scale;
  if (sim.state === 'play') {
    // keyboard nudging for fine aim on a computer
    const k = G.keys, nud = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0), nudY = (k.ArrowUp ? 1 : 0) - (k.ArrowDown ? 1 : 0);
    if (nud || nudY) sim.moveAim(nud * dt * 60 / sim.sh.zoom, nudY * dt * 60 / sim.sh.zoom);
    let left = sdt; while (left > 1e-5) { const s = Math.min(left, 1 / 120); sim.step(s); left -= s; }
  }
  // hand events to the picture and the sound
  if (sim.ev.length) {
    const evs = sim.ev; sim.ev = [];
    for (let i = 0; i < evs.length; i++) {
      const e = evs[i];
      G.view.onEvent(e, sim); Sfx.onEvent(e, sim);
      if (e.k === 'msg') G.pushMsg(e.who, e.text, e.dur);
      else if (e.k === 'kill' && e.how === 'shot' && Save.data.settings.slowmo) G.slowUntil = sim.t + 0.5;
      else if (e.k === 'alarm') G.banner('ALARM RAISED', 'bad');
      else if (e.k === 'duck') G.banner('RUBBER DUCK FOUND', 'good');
      else if (e.k === 'nobreath') G.hud.breath.classList.add('shake'), setTimeout(() => G.hud.breath.classList.remove('shake'), 300);
      else if (e.k === 'end') G.finish();
    }
  }
  G.view.updateReadout(sim, dt);
  G.view.draw(sim, dt, sdt);
  G.updateHud(dt);
  Sfx.tick(sim, dt, G.scale);
};
Game.finish = function () {

  if (document.exitPointerLock && document.pointerLockElement) document.exitPointerLock();

// ---- controls ---------------------------------------------------------------------------
Game.aimDelta = function (dxPx, dyPx, speed) {
  const G = Game, sim = G.sim; if (!sim || sim.state !== 'play' || G.paused) return;
  const ppm = G.view.ppm(sim.sh.zoom), sens = Save.data.settings.sens;
  // slow finger = fine control, fast finger = cover ground
  const acc = clamp(0.5 + speed / 700, 0.5, 1.7);
  const inv = Save.data.settings.invert ? -1 : 1;
  sim.moveAim(-(dxPx / ppm) * sens * acc * inv, (dyPx / ppm) * sens * acc * inv);
};
Game.fire = function () { const G = Game; if (G.sim && G.state === 'mission' && !G.paused) { Sfx.unlock(); G.sim.fire(); } };
Game.zoomBy = function (f) { const s = Game.sim; if (s) s.setZoom(s.sh.zoomT * f); };
Game.zoomTo = function (u) { const s = Game.sim; if (s) s.setZoom(s.st.zoomMin * Math.pow(s.st.zoomMax / s.st.zoomMin, clamp(u, 0, 1))); };

Game.bindInput = function () {
  const G = Game, h = G.hud, stage = G.stage;
  const ptrs = new Map();
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  const onCtl = (t) => t.closest && t.closest('.h-ctl,.h-zoom,.h-btn,.zbtn,.ui,.overlay');
  stage.addEventListener('pointerdown', (e) => {
    if (G.state !== 'mission' || G.paused) return;
    Sfx.unlock();
    if (onCtl(e.target)) return;
    if (e.pointerType === 'mouse') {
      if (e.button === 0) { if (!G.locked && stage.requestPointerLock && !G.touch) { try { stage.requestPointerLock(); } catch (er) { /* fine */ } G.mouseAim = true; if (G.clickArms) { G.clickArms = false; return; } } G.fire(); }

      return;
    }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, t: e.timeStamp });
    if (ptrs.size === 2) { const a = [...ptrs.values()]; G.pinch = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), z: G.sim.sh.zoomT }; }
    e.preventDefault();
  });
  stage.addEventListener('pointermove', (e) => {
    if (G.state !== 'mission' || G.paused) return;
    if (e.pointerType === 'mouse') {
      if (G.locked || (e.buttons === 0 && G.mouseAim)) G.aimDelta(-e.movementX * 1.1, -e.movementY * 1.1, 500);
      return;
    }
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y, dtm = Math.max(1, e.timeStamp - p.t);
    p.x = e.clientX; p.y = e.clientY; p.t = e.timeStamp;
    if (ptrs.size >= 2 && G.pinch) { const a = [...ptrs.values()]; const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); G.sim.setZoom(G.pinch.z * Math.pow(d / Math.max(20, G.pinch.d), 1.3)); return; }
    G.aimDelta(dx, dy, (Math.hypot(dx, dy) / dtm) * 1000);
    e.preventDefault();
  });
  const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) G.pinch = null; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  document.addEventListener('pointerlockchange', () => { G.locked = document.pointerLockElement === stage; if (!G.locked && G.state === 'mission' && !G.paused && G.sim && G.sim.state === 'play' && G.wasLocked) G.pause(true); G.wasLocked = G.locked; });

    elm.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); Sfx.unlock(); elm.classList.add('down'); fn(e); });
    const r = (e) => { elm.classList.remove('down'); if (rel) rel(e); };
    elm.addEventListener('pointerup', r); elm.addEventListener('pointercancel', r); elm.addEventListener('pointerleave', r);
  };
  press(h.fire, () => G.fire());
  press(h.breath, () => { if (G.sim) G.sim.holdBreath(!G.sim.sh.holding); });
  press(h.reload, () => { if (G.sim) G.sim.reload(); });
  press(h.pause, () => G.pause(true));
  press(h.sZero.querySelector('.zminus'), () => { if (G.sim) G.sim.dial(-1); });
  press(h.sZero.querySelector('.zplus'), () => { if (G.sim) G.sim.dial(1); });

  const zt = h.zoom;
  const zset = (e) => { const r = zt.querySelector('.zt').getBoundingClientRect(); G.zoomTo(1 - (e.clientY - r.top) / r.height); };
  zt.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); zt.setPointerCapture(e.pointerId); zt._d = true; zset(e); });

    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { G.pause(!G.paused); e.preventDefault(); return; }
    if (G.paused || !G.sim) return;

    else if (e.key === 'r' || e.key === 'R') G.sim.reload();
    else if (e.key === ' ') { if (!e.repeat) G.fire(); e.preventDefault(); }
    else if (e.key === 'q' || e.key === 'Q' || e.key === '[') G.sim.dial(e.ctrlKey ? -4 : -1);
    else if (e.key === 'e' || e.key === 'E' || e.key === ']') G.sim.dial(e.ctrlKey ? 4 : 1);
    else if (e.key === '=' || e.key === '+') G.zoomBy(1.15);
    else if (e.key === '-' || e.key === '_') G.zoomBy(1 / 1.15);
  });
  window.addEventListener('keyup', (e) => { G.keys[e.key] = false; if (e.key === 'Shift' && G.sim && G.state === 'mission') G.sim.holdBreath(false); });

};

const MISSIONS = [];
const MISSION_BY_ID = {};
function mission(def) { MISSIONS.push(def); MISSION_BY_ID[def.id] = def; return def; }

const COL = { red: '#c8372d', blue: '#2f6db5', green: '#3f8f4f', yellow: '#e2b33c', white: '#ece8dc', grey: '#7a8088', orange: '#e07b2a', purple: '#7d4fa0', pink: '#e07a9a',
  brown: '#7b5a36', black: '#1d2026', teal: '#2a9d8f', navy: '#27365a', cream: '#e8dcc0', tan: '#b89a6a', olive: '#5d6b3a', wine: '#7a2438', sky: '#7fb6e6' };

// A believable random passer-by. `ban` is a test that rejects looks that

function rndLook(R, ban) {
  const hats = [null, null, null, 'cap', 'beanie', 'fedora', 'sun', 'beret'], hairs = [null, 'short', 'short', 'long', 'bun', 'white'];

  const bags = [null, null, null, 'shopping', 'backpack', 'cup', 'case', 'paper'];
  for (let i = 0; i < 30; i++) {
    const L = { h: R.r(0.92, 1.07) };
    const hat = R.pick(hats); if (hat) { L.hat = hat; L.hatCol = R.pick(['#2a2d33', '#5a4634', '#7a8088', '#27365a', '#e8dcc0', '#7a2438']); } else { const hr = R.pick(hairs); if (hr) L.hair = hr; }
    const coat = R.pick(coats); if (coat) { L.coat = coat; L.long = R.chance(0.3); } else if (R.chance(0.25)) L.dress = R.pick([COL.wine, COL.teal, COL.navy, COL.pink]);
    const bag = R.pick(bags); if (bag) L.bag = bag;
    if (R.chance(0.15)) L.glasses = true;
    if (R.chance(0.1)) L.scarf = R.pick([COL.red, COL.yellow, COL.blue, COL.green]);
    if (!ban || !ban(L)) return L;
  }
  return { h: 1 };
}
// A stream of people walking through, so the street feels alive.
// Returns a trigger; put it in the mission's trigger list.
function passersBy(H, o) {
  o = o || {};
  let n = 0;
  return { at: o.first === undefined ? 1.5 : o.first, every: o.every || 7, do(sim) {
    if (sim.alarmT !== null) return;
    const R = sim.rng, dir = R.chance(0.5) ? 1 : -1, x0 = dir > 0 ? (o.x0 || -47) : (o.x1 || 47), x1 = dir > 0 ? (o.x1 || 47) : (o.x0 || -47);
    const a = sim.addActor(Object.assign(H.street(x0), { id: 'pb' + (n++), role: 'civ', look: rndLook(R, o.ban), routine: R.chance(o.stopChance === undefined ? 0.25 : o.stopChance) ? [['walk', R.r(-20, 20)], ['wait', R.r(3, 8), R.pick(['phone', 'stand', 'smoke'])], ['walk', x1], ['gone']] : stroll(x1), speed: R.r(0.85, 1.2) }));
    if (o.plane) a.plane = o.plane;
  } };
}
// Radio line from a character at a given time.
function say(at, who, text, dur) { return { at, do(sim) { sim.msg(who, text, dur); } }; }
function hint(at, text, dur) { return { at, do(sim) { sim.msg('hint', text, dur || 10); } }; }
function onEv(ev, fn, delay) { return { on: ev, delay: delay || 0, do: fn }; }

// Which rifles a mission will accept. Returns null if fine, or a reason.
function gunAllowed(M, st) {
  if (M.range && st.eff < M.range) return 'Not enough reach: this job is at ' + M.range + ' m.';
  const need = M.needs || {};
  if (need.quiet && !st.quiet) return 'This job needs a suppressed rifle.';
  if (need.silent && !st.silent) return 'This job needs a silent rifle: suppressed and subsonic.';
  if (need.glass && st.pen < 0.3) return 'Too weak to shoot through window glass.';
  if (need.rof && st.cycle > need.rof) return 'Too slow between shots for this job.';
  if (need.mag && st.mag < need.mag) return 'Not enough rounds in the magazine for this job.';
  if (need.pen && st.pen < need.pen) return 'Not enough punch for this job.';
  if (M.allow) { const r = M.allow(st); if (r) return r; }
  return null;
}

// ===== 80_test.js =====
// ---------------------------------------------------------------------------
// The test bot. It plays missions through the same simulation the player
// uses, at high speed and without drawing, following each mission's "solve"
// script. It proves a mission can be finished and that a given rifle can do it.
// It never runs during normal play.
// ---------------------------------------------------------------------------
const Test = CB.Test = {};

// Fit whatever the mission demands (a suppressor, subsonic ammo) if the rifle
// can take it, the same way a player would in the loadout screen.
Test.cfgFor = function (M, gunId, base) {
  const g = GUN_BY_ID[gunId], cfg = Object.assign(defaultConfig(gunId), base || {}), need = M.needs || {};
  if ((need.quiet || need.silent) && g.supp === true && cfg.muzzle === 'mz_none') cfg.muzzle = 'mz_supl';
  if (need.silent && g.supp === true && partFits(PART_BY_ID.am_sub, g)) cfg.ammo = 'am_sub';
  return cfg;
};

Test.run = function (missionId, gunId, o) {
  o = o || {};
  const M = MISSION_BY_ID[missionId];
  const cfg = Test.cfgFor(M, gunId, o.cfg);
  const st = buildStats(gunId, cfg);
  const why = gunAllowed(M, st);
  if (why && !o.force) return { skipped: true, why };
  const flags = o.flags || {};
  const sim = new Sim(M, st, o.vantage || 0, { flags, shotSeed: o.seed === undefined ? 1 : o.seed });
  const log = [];
  let script = typeof M.solve === 'function' ? M.solve(sim.A, st, flags, sim) : M.solve;
  if (o.script) script = o.script;
  script = (script || []).map((c) => c.slice());
  let pc = 0, waitUntil = 0, cur = null, pendingShot = null;
  const dt = 1 / 60, maxT = o.maxT || 400;
  sim.setZoom(st.zoomMax);
  const aimAt = (pt, lead) => {
    const sol = sim.aimFor(pt.x, pt.y, pt.z, lead);
    const sh = sim.sh;
    sh.ax = clamp(sol.ax - (sh.swx + sh.recx + sh.offx), sim.lim.x0 - 30, sim.lim.x1 + 30);
    sh.ay = clamp(sol.ay - (sh.swy + sh.recy + sh.offy), sim.lim.y0 - 30, sim.lim.y1 + 30);
    return sol;
  };
  const objById = (id) => sim.S.objects.find((ob) => ob.id === id);
  while (sim.state === 'play' && sim.t < maxT) {
    // run script commands that are ready
    let guard = 0;
    while (guard++ < 20 && sim.state === 'play') {
      if (!cur) { cur = script[pc++]; if (!cur) break; cur._t0 = sim.t; }
      const c = cur, k = c[0];
      if (k === 'wait') { if (sim.t - c._t0 >= c[1]) { cur = null; continue; } break; }
      if (k === 'until') { if (c[1](sim, sim.A)) { cur = null; continue; } if (sim.t - c._t0 > (c[2] || 120)) { log.push('until timed out at step ' + (pc - 1)); cur = null; continue; } break; }
      if (k === 'cover') { if (st.quiet || sim.covered()) { cur = null; continue; } if (sim.t - c._t0 > (c[1] || 90)) { log.push('no cover came'); cur = null; continue; } break; }
      if (k === 'fn') { c[1](sim, sim.A); cur = null; continue; }
      if (k === 'hold') { sim.holdBreath(true); cur = null; continue; }
      if (k === 'dial') { const steps = Math.round((c[1] - sim.sh.zeroR) / 25); for (let i = 0; i < Math.abs(steps); i++) sim.dial(sign(steps)); cur = null; continue; }
      if (k === 'shoot' || k === 'shootObj' || k === 'shootAt') {
        if (c._fired) { // wait for the round to land (unless told not to)
          const b = c._bullet;
          if ((c[3] && c[3].nowait) || !b || !b.alive) {
            if (k === 'shoot' && !(c[3] && c[3].nowait)) { const a = sim.byId[c[1]]; if (a && !a.dead && !(c[3] && c[3].miss)) log.push('shot at ' + c[1] + ' did not kill (t=' + sim.t.toFixed(1) + ')'); }
            if (k === 'shootObj') { const ob = objById(c[1]); if (ob && ob.alive && ob.kind !== 'bell' && ob.kind !== 'horn' && !sim.did('obj:' + c[1])) log.push('shot at object ' + c[1] + ' missed'); }
            cur = null; continue;
          }
          break;
        }
        // line up, wait for the rifle to be ready and settled, then fire
        let pt, lead = null;
        if (k === 'shoot') {
          const a = sim.byId[c[1]];
          if (!a || a.dead || a.gone) { log.push('target ' + c[1] + ' not available (t=' + sim.t.toFixed(1) + ')'); cur = null; continue; }
          if (a.hidden) { if (sim.t - c._t0 > 60) { log.push('target ' + c[1] + ' stayed hidden'); cur = null; continue; } break; }
          pt = sim.partPoint(a, c[2] || 'torso');
          const vx = a.inVeh ? a.inVeh.v * a.inVeh.dir * (a.inVeh.goal !== null ? 1 : 0) : (a.goal !== null ? a.vx : 0);
          lead = { vx, extra: st.action === 'charge' ? (c._charging ? Math.max(0, sim.sh.chargeT) : 0.85) : 0 };
        } else if (k === 'shootObj') {
          const ob = objById(c[1]); if (!ob) { log.push('no object ' + c[1]); cur = null; continue; }
          pt = { x: ob.x, y: ob.y, z: ob.plane.z };
        } else pt = { x: c[1], y: c[2], z: c[3].z || c[3] };
        aimAt(pt, lead);
        const sh = sim.sh;
        if (!sim.canFire() || Math.abs(sh.recy) > 0.05 || Math.abs(sh.recvy) > 0.6 || sim.t - c._t0 < 0.25) break;
        if (st.action === 'charge') { if (!c._charging) { c._charging = true; sim.fire(); } break; }
        const n0 = sim.bullets.length;
        if (sim.fire()) { c._fired = true; c._bullet = sim.bullets[n0]; }
        break;
      }
      log.push('unknown script step ' + k); cur = null;
    }
    // a charging rifle fires on its own; keep the aim solved until it does
    if (cur && cur._charging && !cur._fired) {
      const n = sim.bullets.length; sim.step(dt);
      if (sim.bullets.length > n) { cur._fired = true; cur._bullet = sim.bullets[n]; }
      sim.ev.length = 0; continue;
    }
    sim.step(dt);
    sim.ev.length = 0;
  }
  const res = sim.result || { win: false, fail: { code: 'timeout', text: 'test ran out of time' }, stars: 0 };
  return { ok: !!res.win, stars: res.stars, clean: res.clean, precise: res.precise, challenge: res.challenge, fail: res.fail ? res.fail.code + ': ' + res.fail.text : null, t: +sim.t.toFixed(1), shots: sim.stats.shots, log, outcome: res.outcome ? res.outcome.id : null, alarmBy: sim.alarmBy || null };
};

// Every mission with every rifle it allows, and every shooting position.
Test.matrix = function (o) {
  o = o || {};
  const out = { runs: 0, fails: [], notClean: [], skipped: 0, perMission: {} };
  MISSIONS.forEach((M) => {
    if (o.only && o.only.indexOf(M.id) < 0) return;
    const variants = M.testFlags || [{}];
    const pm = out.perMission[M.id] = { ok: 0, fail: 0, guns: [], skipped: [] };
    variants.forEach((flags) => {
      GUNS.forEach((g) => {
        const nv = (M.vantages || [0]).length;
        for (let v = 0; v < nv; v++) {
          if (v > 0 && g.id !== (o.vantageGun || 'halden') && g.id !== 'fenwick') continue;
          const r = Test.run(M.id, g.id, { vantage: v, flags, seed: o.seed });
          if (r.skipped) { if (v === 0 && pm.skipped.indexOf(g.id) < 0) pm.skipped.push(g.id); out.skipped++; continue; }
          out.runs++;
          if (r.ok) { pm.ok++; if (pm.guns.indexOf(g.id) < 0) pm.guns.push(g.id); if (r.stars < 3 && !M.loudOk) out.notClean.push({ m: M.id, gun: g.id, v, stars: r.stars, clean: r.clean, precise: r.precise, shots: r.shots, alarmBy: r.alarmBy }); }
          else { pm.fail++; out.fails.push({ m: M.id, gun: g.id, v, flags, fail: r.fail, log: r.log, t: r.t }); }
        }
      });
    });
  });
  return out;
};

// Debug sheet: every rifle drawn in a grid (used when checking the artwork).
Test.gunSheet = function (cfgOver, skins) {
  const c = document.createElement('canvas'), dpr = 2, cols = 2, cw = 600, ch = 150;
  c.width = cols * cw * dpr; c.height = Math.ceil(GUNS.length / cols) * ch * dpr;
  c.style.cssText = 'position:fixed;left:0;top:0;z-index:99;width:' + cols * cw + 'px;background:#141a22';
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.fillStyle = '#141a22'; x.fillRect(0, 0, 4000, 4000);
  GUNS.forEach((g, i) => {
    const cfg = Object.assign(defaultConfig(g.id), cfgOver || {}); if (skins) cfg.skin = skins[i % skins.length];
    ['muzzle', 'barrel', 'stock', 'support', 'mag'].forEach((s) => { const p = PART_BY_ID[cfg[s]]; if (p && !partFits(p, g)) cfg[s] = defaultConfig(g.id)[s]; });
    if (!scopeFits(SCOPE_BY_ID[cfg.scope], g)) cfg.scope = g.scope;
    const cx = (i % cols) * cw + cw / 2, cy = Math.floor(i / cols) * ch + ch / 2;
    drawGun(x, g.id, cfg, cx, cy, cw - 30, ch - 16, { time: 1.2 });
    x.fillStyle = '#8e9aa8'; x.font = '12px sans-serif'; x.fillText(g.name + (skins ? '  /  ' + SKIN_BY_ID[cfg.skin].name : ''), (i % cols) * cw + 8, Math.floor(i / cols) * ch + 14);
  });
  document.body.appendChild(c);
  return GUNS.length;
};
